services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      BOOTSTRAP_ADMIN_SECRET: ${BOOTSTRAP_ADMIN_SECRET}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
