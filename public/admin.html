<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>품앗이 관리자</title>
  <style>
    :root{--bg:#101722;--panel:#182230;--line:#2a394b;--text:#edf4f7;--muted:#9db0be;--main:#49d6b4;--danger:#ff8585;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Malgun Gothic",sans-serif}.hidden{display:none!important}.login{width:min(380px,calc(100% - 32px));margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.shell{display:flex;min-height:100vh}.sidebar{width:210px;padding:22px 14px;background:#131d29;border-right:1px solid var(--line)}h1{font-size:17px;margin:0 0 4px}h1 small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:400}.nav{margin-top:26px;display:grid;gap:5px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:8px;font:inherit;cursor:pointer}.nav button.active{background:var(--panel);color:var(--main);font-weight:700}.content{width:100%;max-width:1200px;padding:24px}.content h2{font-size:18px;margin:0 0 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.card h3{font-size:13px;margin:0 0 14px;color:var(--muted)}label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px}input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#101722;color:var(--text);font:inherit}button{font:inherit;cursor:pointer}.primary,.small{border:0;border-radius:8px;padding:10px 13px;background:var(--main);color:#08221c;font-weight:700}.small{padding:6px 8px;font-size:12px;margin:1px}.small.secondary{background:#2b3b4d;color:var(--text)}.small.danger{background:#4d2730;color:var(--danger)}.message{padding:11px;border-radius:8px;background:#17483f;color:#85f1d0;margin-bottom:12px}.message.error{background:#4d2730;color:#ffb4b4}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted)}.badge{padding:3px 7px;border-radius:99px;font-size:11px;font-weight:700;background:#2b3b4d}.badge.pending{background:#59461f;color:var(--warn)}.badge.approved,.badge.resolved{background:#17483f;color:#85f1d0}.badge.rejected,.badge.locked,.badge.unresolved{background:#4d2730;color:#ffb4b4}@media(max-width:700px){.shell{display:block}.sidebar{width:auto}.nav{grid-template-columns:repeat(3,1fr);margin-top:15px}.nav button{text-align:center}.content{padding:16px}}
  </style>
</head>
<body>
  <section id="login" class="login hidden"><h1>품앗이 관리자<small>운영자 계정으로 로그인하세요</small></h1><div id="login-message"></div><form id="login-form"><label>닉네임</label><input name="nickname" required><label>비밀번호</label><input name="password" type="password" required><p><button class="primary">로그인</button></p></form><a href="/" style="color:var(--muted)">회원 화면으로</a></section>
  <section id="denied" class="login hidden"><h1>접근 권한이 없습니다</h1><p style="color:var(--muted)">운영자 역할이 있는 계정으로 로그인해야 합니다.</p><a href="/" style="color:var(--main)">회원 화면으로 이동</a></section>
  <section id="app" class="shell hidden"><aside class="sidebar"><h1>◆ 품앗이 ADMIN<small id="admin-name"></small></h1><nav class="nav"><button class="active" data-tab="users">회원 관리</button><button data-tab="rooms">방 관리</button><button data-tab="visits">방문 기록</button><button data-tab="penalties">패널티</button><button data-tab="reports">신고</button><button data-tab="logs">로그</button><button data-tab="database">DB 보기</button></nav><p><a href="/" style="color:var(--muted)">회원 화면</a></p><button id="logout" class="small secondary">로그아웃</button></aside><main class="content"><h2 id="title">회원 관리</h2><div id="message"></div><section id="tab-users" class="card"><h3>회원 목록 및 승인</h3><div id="users"></div></section><section id="tab-rooms" class="card hidden"><h3>전체 방</h3><div id="rooms"></div></section><section id="tab-visits" class="card hidden"><h3>최근 방문 기록</h3><div id="visits"></div></section><section id="tab-penalties" class="card hidden"><h3>패널티 현황</h3><div id="penalties"></div></section><section id="tab-reports" class="card hidden"><h3>신고 접수 및 처리</h3><div id="reports"></div></section><section id="tab-logs" class="card hidden"><h3>감사 로그</h3><div id="logs"></div></section><section id="tab-database" class="card hidden"><h3>SQLite 테이블 조회</h3><div id="database"></div></section></main></section>
  <script>
    const $=s=>document.querySelector(s);const api=async(path,options={})=>{const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'request_failed');return d};const esc=value=>{const e=document.createElement('span');e.textContent=value??'';return e.innerHTML};const when=value=>value?new Date(value).toLocaleString('ko-KR'):'-';const msg=(text,bad=false)=>$('#message').innerHTML=text?`<div class="message ${bad?'error':''}">${esc(text)}</div>`:'';const table=(headers,rows)=>rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="empty">데이터가 없습니다.</p>';const badge=value=>`<span class="badge ${esc(value)}">${esc(value)}</span>`;
    let user;const loaders={users:loadUsers,rooms:loadRooms,visits:loadVisits,penalties:loadPenalties,reports:loadReports,logs:loadLogs,database:loadDatabase};
    async function boot(){try{const me=await api('/api/auth/me');user=me.user;const admin=await api('/api/admin/me');if(!admin.user.roles.includes('admin'))throw new Error('forbidden');show();}catch(error){if(error.message==='authentication_required')$('#login').classList.remove('hidden');else $('#denied').classList.remove('hidden')}}
    function show(){$('#app').classList.remove('hidden');$('#admin-name').textContent=user.nickname+' 운영자';loadUsers()}
    $('#login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.reload()}catch(error){$('#login-message').innerHTML='<div class="message error">로그인에 실패했습니다.</div>'}};
    $('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{const tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));Object.keys(loaders).forEach(name=>$('#tab-'+name).classList.toggle('hidden',name!==tab));$('#title').textContent=button.textContent;loaders[tab]()});
    async function loadUsers(){const {users}=await api('/api/admin/users');$('#users').innerHTML=table(['닉네임','블로그','상태','가입일','처리'],users.map(u=>`<tr><td>${esc(u.nickname)}</td><td><a style="color:var(--main)" href="${esc(u.blogUrl)}" target="_blank" rel="noreferrer">${esc(u.blogName)}</a></td><td>${badge(u.accountStatus)}</td><td>${when(u.createdAt)}</td><td><button class="small" onclick="setUser('${u.id}','approved')">승인</button><button class="small secondary" onclick="setUser('${u.id}','rejected')">반려</button><button class="small danger" onclick="setUser('${u.id}','locked')">잠금</button></td></tr>`))}
    window.setUser=async(id,status)=>{try{await api('/api/admin/users/'+id+'/account-status',{method:'PATCH',body:JSON.stringify({accountStatus:status})});msg('회원 상태를 변경했습니다.');loadUsers()}catch(e){msg('처리에 실패했습니다.',true)}};
    async function loadRooms(){const {rooms}=await api('/api/admin/rooms');$('#rooms').innerHTML=table(['방','유형','생성자','참여','상태','종료'],rooms.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.room_type)}</td><td>${esc(r.creator_nickname)}</td><td>${r.participant_count}/${r.capacity}</td><td>${badge(r.room_status)}</td><td>${when(r.closes_at)}</td></tr>`))}
    async function loadVisits(){const {visits}=await api('/api/admin/visits');$('#visits').innerHTML=table(['방','방문자','대상','시각'],visits.map(v=>`<tr><td>${esc(v.room_name)}</td><td>${esc(v.visitor_nickname)}</td><td>${esc(v.target_nickname)}</td><td>${when(v.visited_at)}</td></tr>`))}
    async function loadPenalties(){const {penalties}=await api('/api/admin/penalties');$('#penalties').innerHTML=table(['회원','방','사유','상태','발행일'],penalties.map(p=>`<tr><td>${esc(p.nickname)}</td><td>${esc(p.room_name)}</td><td>${esc(p.reason)}</td><td>${badge(p.status)}</td><td>${when(p.issued_at)}</td></tr>`))}
    async function loadReports(){const {reports}=await api('/api/admin/reports');$('#reports').innerHTML=table(['신고자','대상','방','사유','상태','처리'],reports.map(r=>`<tr><td>${esc(r.reporter_nickname)}</td><td>${esc(r.target_nickname)}</td><td>${esc(r.room_name||'-')}</td><td>${esc(r.reason)}</td><td>${badge(r.report_status)}</td><td>${r.report_status==='pending'?`<button class="small" onclick="setReport('${r.id}','resolved')">해결</button><button class="small secondary" onclick="setReport('${r.id}','dismissed')">기각</button>`:'-'}</td></tr>`))}
    window.setReport=async(id,status)=>{try{await api('/api/admin/reports/'+id+'/status',{method:'PATCH',body:JSON.stringify({reportStatus:status})});msg('신고를 처리했습니다.');loadReports()}catch(e){msg('처리에 실패했습니다.',true)}};
    async function loadLogs(){const {logs}=await api('/api/admin/audit-logs');$('#logs').innerHTML=table(['시각','수행자','이벤트','대상','내용'],logs.map(l=>`<tr><td>${when(l.created_at)}</td><td>${esc(l.actor_nickname||'system')}</td><td>${esc(l.event_type)}</td><td>${esc(l.target_type||'-')}</td><td>${esc(l.metadata_json)}</td></tr>`))}
    async function loadDatabase(){const {tables}=await api('/api/admin/database/overview');$('#database').innerHTML=`<div class="message">${tables.map(t=>`${esc(t.name)}: ${t.count}건`).join(' &nbsp; ')}</div><label>테이블<select id="database-table">${tables.map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${t.count})</option>`).join('')}</select></label><div id="database-rows"></div>`;$('#database-table').onchange=loadDatabaseRows;loadDatabaseRows()}
    async function loadDatabaseRows(){const tableName=$('#database-table').value;const {rows}=await api('/api/admin/database/'+tableName+'?limit=100');const columns=rows.length?Object.keys(rows[0]):[];const value=(key,item)=>{const raw=item[key];if(raw===null||raw===undefined)return '-';if(key.endsWith('_at')&&typeof raw==='number')return when(raw);return esc(typeof raw==='object'?JSON.stringify(raw):String(raw))};$('#database-rows').innerHTML=columns.length?table(columns,rows.map(item=>`<tr>${columns.map(key=>`<td>${value(key,item)}</td>`).join('')}</tr>`)):'<p class="empty">데이터가 없습니다.</p>'}
    boot();
  </script>
</body>
</html>
