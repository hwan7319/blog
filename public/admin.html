<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>품앗이 관리자</title>
  <style>
    :root{--bg:#101722;--panel:#182230;--line:#2a394b;--text:#edf4f7;--muted:#9db0be;--main:#49d6b4;--danger:#ff8585;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Malgun Gothic",sans-serif}.hidden{display:none!important}.login{width:min(380px,calc(100% - 32px));margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.shell{display:flex;min-height:100vh}.sidebar{width:210px;padding:22px 14px;background:#131d29;border-right:1px solid var(--line)}h1{font-size:17px;margin:0 0 4px}h1 small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:400}.nav{margin-top:26px;display:grid;gap:5px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:8px;font:inherit;cursor:pointer}.nav button.active{background:var(--panel);color:var(--main);font-weight:700}.content{width:100%;max-width:1200px;padding:24px}.content h2{font-size:18px;margin:0 0 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.card h3{font-size:13px;margin:0 0 14px;color:var(--muted)}label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#101722;color:var(--text);font:inherit}textarea{min-height:220px;resize:vertical}button{font:inherit;cursor:pointer}.primary,.small{border:0;border-radius:8px;padding:10px 13px;background:var(--main);color:#08221c;font-weight:700}.small{padding:6px 8px;font-size:12px;margin:1px}.small.secondary{background:#2b3b4d;color:var(--text)}.small.danger{background:#4d2730;color:var(--danger)}.message{padding:11px;border-radius:8px;background:#17483f;color:#85f1d0;margin-bottom:12px}.message.error{background:#4d2730;color:#ffb4b4}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted)}.badge{padding:3px 7px;border-radius:99px;font-size:11px;font-weight:700;background:#2b3b4d}.badge.pending{background:#59461f;color:var(--warn)}.badge.approved,.badge.resolved{background:#17483f;color:#85f1d0}.badge.rejected,.badge.locked,.badge.unresolved{background:#4d2730;color:#ffb4b4}.editor{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px}@media(max-width:700px){.shell{display:block}.sidebar{width:auto}.nav{grid-template-columns:repeat(3,1fr);margin-top:15px}.nav button{text-align:center}.content{padding:16px}}
  </style>
</head>
<body>
  <section id="login" class="login hidden"><h1>품앗이 관리자<small>운영자 계정으로 로그인하세요</small></h1><div id="login-message"></div><form id="login-form"><label>닉네임</label><input name="nickname" required><label>비밀번호</label><input name="password" type="password" required><p><button class="primary">로그인</button></p></form><a href="/" style="color:var(--muted)">회원 화면으로</a></section>
  <section id="denied" class="login hidden"><h1>접근 권한이 없습니다</h1><p style="color:var(--muted)">운영자 역할이 있는 계정으로 로그인해야 합니다.</p><a href="/" style="color:var(--main)">회원 화면으로 이동</a></section>
  <section id="app" class="shell hidden"><aside class="sidebar"><h1>◆ 품앗이 ADMIN<small id="admin-name"></small></h1><nav class="nav"><button class="active" data-tab="users">회원 관리</button><button data-tab="rooms">방 관리</button><button data-tab="visits">방문 기록</button><button data-tab="penalties">패널티</button><button data-tab="reports">신고</button><button data-tab="logs">로그</button><button data-tab="database">DB 보기</button></nav><p><a href="/" style="color:var(--muted)">회원 화면</a></p><button id="logout" class="small secondary">로그아웃</button></aside><main class="content"><h2 id="title">회원 관리</h2><div id="message"></div><section id="tab-users" class="card"><h3>회원 목록 및 승인</h3><div id="users"></div></section><section id="tab-rooms" class="card hidden"><h3>전체 방</h3><div id="rooms"></div></section><section id="tab-visits" class="card hidden"><h3>최근 방문 기록</h3><div id="visits"></div></section><section id="tab-penalties" class="card hidden"><h3>패널티 현황</h3><div id="penalties"></div></section><section id="tab-reports" class="card hidden"><h3>신고 접수 및 처리</h3><div id="reports"></div></section><section id="tab-logs" class="card hidden"><h3>감사 로그</h3><div id="logs"></div></section><section id="tab-database" class="card hidden"><h3>SQLite 테이블 조회</h3><div id="database"></div></section></main></section>
  <script>
    const $=s=>document.querySelector(s);const api=async(path,options={})=>{const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'request_failed');return d};const esc=value=>{const e=document.createElement('span');e.textContent=value??'';return e.innerHTML};const when=value=>value?new Date(value).toLocaleString('ko-KR'):'-';const msg=(text,bad=false)=>$('#message').innerHTML=text?`<div class="message ${bad?'error':''}">${esc(text)}</div>`:'';const table=(headers,rows)=>rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="empty">데이터가 없습니다.</p>';const badge=value=>`<span class="badge ${esc(value)}">${esc(value)}</span>`;
    let user;const loaders={users:loadUsers,rooms:loadRooms,visits:loadVisits,penalties:loadPenalties,reports:loadReports,logs:loadLogs,database:loadDatabase};
    async function boot(){try{const me=await api('/api/auth/me');user=me.user;const admin=await api('/api/admin/me');if(!admin.user.roles.includes('admin'))throw new Error('forbidden');show();}catch(error){if(error.message==='authentication_required')$('#login').classList.remove('hidden');else $('#denied').classList.remove('hidden')}}
    function show(){$('#app').classList.remove('hidden');$('#admin-name').textContent=user.nickname+' 운영자';loadUsers()}
    $('#login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.reload()}catch(error){$('#login-message').innerHTML='<div class="message error">로그인에 실패했습니다.</div>'}};
    $('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{const tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));Object.keys(loaders).forEach(name=>$('#tab-'+name).classList.toggle('hidden',name!==tab));$('#title').textContent=button.textContent;loaders[tab]()});
    async function loadUsers(){const {users}=await api('/api/admin/users');$('#users').innerHTML=table(['닉네임','블로그','상태','가입일','처리'],users.map(u=>`<tr><td>${esc(u.nickname)}</td><td><a style="color:var(--main)" href="${esc(u.blogUrl)}" target="_blank" rel="noreferrer">${esc(u.blogName)}</a></td><td>${badge(u.accountStatus)}</td><td>${when(u.createdAt)}</td><td><button class="small" onclick="setUser('${u.id}','approved')">승인</button><button class="small secondary" onclick="setUser('${u.id}','rejected')">반려</button><button class="small danger" onclick="setUser('${u.id}','locked')">잠금</button></td></tr>`))}
    window.setUser=async(id,status)=>{try{await api('/api/admin/users/'+id+'/account-status',{method:'PATCH',body:JSON.stringify({accountStatus:status})});msg('회원 상태를 변경했습니다.');loadUsers()}catch(e){msg('처리에 실패했습니다.',true)}};
    async function loadRooms(){const {rooms}=await api('/api/admin/rooms');$('#rooms').innerHTML=table(['방','유형','생성자','참여','상태','종료'],rooms.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.room_type)}</td><td>${esc(r.creator_nickname)}</td><td>${r.participant_count}/${r.capacity}</td><td>${badge(r.room_status)}</td><td>${when(r.closes_at)}</td></tr>`))}
    async function loadVisits(){const {visits}=await api('/api/admin/visits');$('#visits').innerHTML=table(['방','방문자','대상','시각'],visits.map(v=>`<tr><td>${esc(v.room_name)}</td><td>${esc(v.visitor_nickname)}</td><td>${esc(v.target_nickname)}</td><td>${when(v.visited_at)}</td></tr>`))}
    async function loadPenalties(){const {penalties}=await api('/api/admin/penalties');$('#penalties').innerHTML=table(['회원','방','사유','상태','발행일'],penalties.map(p=>`<tr><td>${esc(p.nickname)}</td><td>${esc(p.room_name)}</td><td>${esc(p.reason)}</td><td>${badge(p.status)}</td><td>${when(p.issued_at)}</td></tr>`))}
    async function loadReports(){const {reports}=await api('/api/admin/reports');$('#reports').innerHTML=table(['신고자','대상','방','사유','상태','처리'],reports.map(r=>`<tr><td>${esc(r.reporter_nickname)}</td><td>${esc(r.target_nickname)}</td><td>${esc(r.room_name||'-')}</td><td>${esc(r.reason)}</td><td>${badge(r.report_status)}</td><td>${r.report_status==='pending'?`<button class="small" onclick="setReport('${r.id}','resolved')">해결</button><button class="small secondary" onclick="setReport('${r.id}','dismissed')">기각</button>`:'-'}</td></tr>`))}
    window.setReport=async(id,status)=>{try{await api('/api/admin/reports/'+id+'/status',{method:'PATCH',body:JSON.stringify({reportStatus:status})});msg('신고를 처리했습니다.');loadReports()}catch(e){msg('처리에 실패했습니다.',true)}};
    async function loadLogs(){const {logs}=await api('/api/admin/audit-logs');$('#logs').innerHTML=table(['시각','수행자','이벤트','대상','내용'],logs.map(l=>`<tr><td>${when(l.created_at)}</td><td>${esc(l.actor_nickname||'system')}</td><td>${esc(l.event_type)}</td><td>${esc(l.target_type||'-')}</td><td>${esc(l.metadata_json)}</td></tr>`))}
    let databaseRows=[],databaseRelations={users:[],rooms:[]};const databaseNames={users:'회원',rooms:'방',participants:'방 참여',visits:'방문',penalties:'패널티',reports:'신고',audit_logs:'운영 로그'};
    const input=(name,label,value='',type='text',required=false)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;
    const select=(name,label,options,value='',required=false)=>`<label>${label}<select name="${name}" ${required?'required':''}>${options.map(([id,text])=>`<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`;
    const localTime=value=>{if(!value)return '';const d=new Date(value),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
    const userOptions=(value='',empty=false)=>[...(empty?[['','선택 안 함']]:[]),...databaseRelations.users.map(row=>[row.id,`${row.nickname} · ${row.blog_name}`])];
    const roomOptions=(value='',empty=false)=>[...(empty?[['','선택 안 함']]:[]),...databaseRelations.rooms.map(row=>[row.id,`${row.name} (${row.room_status})`])];
    async function loadDatabase(){const [{tables},{rows:users},{rows:rooms}]=await Promise.all([api('/api/admin/database/overview'),api('/api/admin/database/users?limit=100'),api('/api/admin/database/rooms?limit=100')]);databaseRelations={users,rooms};$('#database').innerHTML=`<div class="message">${tables.map(t=>`${esc(databaseNames[t.name]||t.name)}: ${t.count}건`).join(' &nbsp; ')}</div><label>관리할 항목<select id="database-table">${tables.map(t=>`<option value="${esc(t.name)}">${esc(databaseNames[t.name]||t.name)} (${t.count})</option>`).join('')}</select></label><p><button class="primary" id="database-create">새 항목 등록</button></p><div id="database-rows"></div><div id="database-editor"></div>`;$('#database-table').onchange=loadDatabaseRows;$('#database-create').onclick=()=>openDatabaseEditor('create',$('#database-table').value);loadDatabaseRows()}
    async function loadDatabaseRows(){const tableName=$('#database-table').value;const {rows}=await api('/api/admin/database/'+tableName+'?limit=100');databaseRows=rows;const columns=rows.length?Object.keys(rows[0]):[];const value=(key,item)=>{const raw=item[key];if(raw===null||raw===undefined)return '-';if(key.endsWith('_at')&&typeof raw==='number')return when(raw);return esc(typeof raw==='object'?JSON.stringify(raw):String(raw))};$('#database-rows').innerHTML=columns.length?table([...columns,'작업'],rows.map(item=>`<tr>${columns.map(key=>`<td>${value(key,item)}</td>`).join('')}<td><button class="small secondary" onclick='openDatabaseEditor("edit","${tableName}","${item.id}")'>수정</button><button class="small danger" onclick='deleteDatabaseRecord("${tableName}","${item.id}")'>삭제</button></td></tr>`)):'<p class="empty">데이터가 없습니다.</p>'}
    function editorFields(tableName,item,mode){const create=mode==='create',users=userOptions(),rooms=roomOptions();if(tableName==='users')return input('nickname','닉네임',item.nickname,'text',true)+input('password',create?'비밀번호':'새 비밀번호 (바꾸지 않으면 비워두세요)','','password',create)+input('blog_url','블로그 주소',item.blog_url||'https://','url',true)+input('blog_name','블로그명',item.blog_name,'text',true)+select('account_status','회원 상태',[['pending','승인 대기'],['approved','승인'],['rejected','반려'],['locked','잠금']],item.account_status||'pending');if(tableName==='rooms')return input('name','방 이름',item.name,'text',true)+select('room_type','방 유형',[['keyword','키워드방'],['link','링크방']],item.room_type||'keyword',true)+select('creator_id','방장',users,item.creator_id,true)+input('capacity','모집 인원',item.capacity||2,'number',true)+input('join_starts_at','참여 시작',localTime(item.join_starts_at||Date.now()+60000),'datetime-local',true)+input('join_ends_at','참여 마감',localTime(item.join_ends_at||Date.now()+960000),'datetime-local',true)+input('closes_at','방 종료',localTime(item.closes_at||Date.now()+1860000),'datetime-local',true)+input('missions','미션 (쉼표로 구분)',(()=>{try{return JSON.parse(item.missions_json||'["공감"]').join(', ')}catch{return '공감'}})(),'text',true)+select('room_status','진행 상태',[['waiting','모집 중'],['in_progress','진행 중'],['closed','종료'],['deleted','삭제']],item.room_status||'waiting');if(tableName==='participants')return select('room_id','방',rooms,item.room_id,true)+select('user_id','참여 회원',users,item.user_id,true)+input('keyword','키워드 (키워드방)',item.keyword)+input('link_url','게시글 링크 (링크방)',item.link_url,'url');if(tableName==='visits')return select('room_id','방',rooms,item.room_id,true)+select('visitor_id','방문한 회원',users,item.visitor_id,true)+select('target_id','방문 대상',users,item.target_id,true);if(tableName==='penalties')return select('user_id','대상 회원',users,item.user_id,true)+select('room_id','관련 방',rooms,item.room_id,true)+select('reason','사유',[['auto_incomplete','미션 미완료'],['participant_report','참여자 신고'],['admin','운영자 처리']],item.reason||'admin',true)+select('status','처리 상태',[['unresolved','미해결'],['resolved','해결']],item.status||'unresolved');if(tableName==='reports')return select('reporter_id','신고자',users,item.reporter_id,true)+select('target_id','신고 대상',users,item.target_id,true)+select('room_id','관련 방',roomOptions('',true),item.room_id,true)+input('reason','신고 내용',item.reason,'text',true)+select('report_status','처리 상태',[['pending','대기'],['resolved','해결'],['dismissed','기각']],item.report_status||'pending');return select('actor_id','수행 운영자',userOptions('',true),item.actor_id||'',false)+input('event_type','기록 제목',item.event_type||'운영 메모','text',true)+input('target_type','대상 종류',item.target_type||'','text')+input('target_id','대상 ID',item.target_id||'','text')+input('note','운영 메모',(()=>{try{return JSON.parse(item.metadata_json||'{}').note||''}catch{return ''}})(),'text')}
    function editorValues(tableName,form,mode){const raw=Object.fromEntries(new FormData(form));const values={...raw};if(tableName==='users'&&mode==='edit'&&!values.password)delete values.password;if(tableName==='rooms'){['capacity'].forEach(k=>values[k]=Number(values[k]));['join_starts_at','join_ends_at','closes_at'].forEach(k=>values[k]=new Date(values[k]).getTime());values.missions_json=JSON.stringify(values.missions.split(',').map(v=>v.trim()).filter(Boolean));delete values.missions}if(tableName==='participants'){if(!values.keyword)values.keyword=null;if(!values.link_url)values.link_url=null}if(tableName==='reports'&&!values.room_id)values.room_id=null;if(tableName==='audit_logs'){values.metadata_json=JSON.stringify({note:values.note||''});delete values.note;if(!values.actor_id)values.actor_id=null}return values}
    window.openDatabaseEditor=(mode,tableName,id)=>{const item=mode==='edit'?databaseRows.find(row=>row.id===id):{};if(!item)return;$('#database-editor').innerHTML=`<form class="editor" id="database-form"><h3>${mode==='create'?'새 항목 등록':'항목 수정'} · ${esc(databaseNames[tableName])}</h3><p class="message">필수 항목만 입력하면 됩니다. 회원과 방은 목록에서 선택하세요.</p>${editorFields(tableName,item,mode)}<p><button class="primary">저장</button> <button type="button" class="small secondary" id="database-cancel">취소</button></p></form>`;$('#database-cancel').onclick=()=>$('#database-editor').innerHTML='';$('#database-form').onsubmit=async event=>{event.preventDefault();try{const values=editorValues(tableName,event.target,mode);const path='/api/admin/database/'+tableName+(mode==='edit'?'/'+item.id:'');await api(path,{method:mode==='edit'?'PATCH':'POST',body:JSON.stringify({values})});msg('저장했습니다.');$('#database-editor').innerHTML='';loadDatabase()}catch(error){msg('저장에 실패했습니다. 입력한 내용을 확인하세요.',true)}}};
    window.deleteDatabaseRecord=async(tableName,id)=>{if(!confirm('이 레코드를 삭제할까요? 연결된 데이터가 있으면 삭제되지 않습니다.'))return;try{await api('/api/admin/database/'+tableName+'/'+id,{method:'DELETE'});msg('DB 레코드를 삭제했습니다.');loadDatabase()}catch(error){msg('삭제에 실패했습니다. 연결된 데이터 또는 권한을 확인하세요.',true)}};
    boot();
  </script>
</body>
</html>
